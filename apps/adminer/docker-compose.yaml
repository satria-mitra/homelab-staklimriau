version: "3.8"

services:
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8181:8080"
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb  # nama container Postgres kamu
    networks:
      - shared_network

networks:
  shared_network:
    external: true
